// Job model shared by the runtime, tdrctl, the control plane and the SDK.

syntax = "proto3";

package fireforge.tdr.v1;

import "fireforge/tdr/v1/record.proto";

// Lifecycle (Description.md section 10.1).
// Phase 1 local path: CREATED -> QUEUED -> ASSIGNED -> RUNNING -> COMMITTING -> COMPLETED
// LEASED is used once the control plane hands out leases (Phase 4).
enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  CREATED = 1;
  QUEUED = 2;
  LEASED = 3;
  ASSIGNED = 4;        // resources reserved on this node
  RUNNING = 5;         // child process alive
  COMMITTING = 6;      // child finished OK, outputs being published
  COMPLETED = 7;       // terminal
  FAILED = 8;          // terminal: attempts exhausted or non-retryable
  RETRY_PENDING = 9;   // attempt failed, another attempt allowed
  CANCELLED = 10;      // terminal
  EXPIRED = 11;        // terminal: lease/timeout expired with no retries left
  VALIDATION_FAILED = 12;  // terminal: outputs rejected
}

message ResourceRequest {
  uint32 cpu_cores = 1;     // 0 is treated as 1
  uint64 memory_bytes = 2;  // 0 = node default (see daemon config)
  uint64 disk_bytes = 3;
  uint32 gpu_count = 4;
}

message ExecutionPolicy {
  uint32 max_attempts = 1;      // 0 is treated as 1
  uint64 timeout_seconds = 2;   // 0 = no timeout
  bool checkpoint = 3;
}

// How the daemon launches the child process.
message Command {
  repeated string argv = 1;          // argv[0] resolved via PATH
  map<string, string> env = 2;       // added to the minimal child environment
}

// Multi-node MPI (docs/design/phase7.md §2). JobSpec.resources is then per rank
// (disk_bytes per node), and command.argv is the program every rank runs.
message MpiSpec {
  uint32 ranks = 1;                 // > 0 makes the job a gang job
  uint32 max_ranks_per_node = 2;    // 0 = no cap
  repeated string mpirun_args = 3;  // extra mpirun args placed before the program
}

message JobSpec {
  string job_id = 1;          // empty on submit = daemon assigns one
  string campaign_id = 2;
  string material_id = 3;

  string operation = 4;       // e.g. "transport.calculate" (SDK task name)
  string solver = 5;
  string solver_version = 6;

  ResourceRequest resources = 7;
  ExecutionPolicy policy = 8;

  repeated string input_artifacts = 9;  // "artifact://sha256/<64 hex>"
  repeated string depends_on = 10;      // job ids (Phase 6; ignored in Phase 1)

  Command command = 11;
  string parameters_json = 12;          // opaque to the runtime, passed to the task
  repeated string required_capabilities = 13;

  // ---- Phase 6 (docs/design/phase6.md) ----
  repeated string input_names = 14;     // parallel to input_artifacts ("" = unnamed); may be shorter
  string resume_checkpoint = 15;        // artifact id of the checkpoint to resume from ("" = none)
  string workflow_id = 16;              // set by the control plane for workflow steps
  string step = 17;                     // full step name within the workflow

  // ---- Phase 7 (docs/design/phase7.md) ----
  MpiSpec mpi = 18;                     // ranks > 0: multi-node MPI job
}

// An output (or checkpoint) with its logical name (phase6.md §2).
message NamedArtifact {
  string artifact_id = 1;
  string name = 2;
  uint64 size = 3;
  string media_type = 4;
}

// ---- workflows (phase6.md §3) ----
enum RunIf {
  ALL_SUCCEEDED = 0;   // default: every dependency (and its spawned subtree) COMPLETED
  ANY_FAILED = 1;      // at least one FAILED/EXPIRED/VALIDATION_FAILED/CANCELLED
  ALWAYS = 2;
}

message StepInput {
  string step = 1;      // full step name; in a spawn, a sibling's short name, or "." = the spawning step
  string output = 2;    // output name; "" or "*" = all outputs
  bool spawned = 3;     // also the same selection from every COMPLETED step in its spawned subtree
  string input_name = 4; // input name for the child ("" = the output name)
}

message StepSpec {
  string name = 1;                  // [A-Za-z0-9_.-]{1,64}; spawned: short name (stored as "<parent>/<name>")
  JobSpec job = 2;                  // template: no job_id/campaign_id/workflow fields
  repeated string depends_on = 3;   // step names (StepInput.step entries are implicit dependencies)
  repeated StepInput inputs = 4;
  RunIf run_if = 5;
  bool allow_failure = 6;           // a failure of this step doesn't fail the workflow
}

message JobStatus {
  string job_id = 1;
  JobState state = 2;
  JobSpec spec = 3;
  uint32 attempts_used = 4;
  string current_attempt_id = 5;
  string last_error = 6;
  repeated string output_artifacts = 7;
  int64 created_unix_ms = 8;
  int64 updated_unix_ms = 9;
  double progress_fraction = 10;   // last WORKER_PROGRESS, 0..1
  string progress_message = 11;
  string node_id = 12;             // central jobs: executing node (Phase 4)
  string remote_job_id = 13;       // local copy of a leased job: the central job id
  // ---- Phase 6 ----
  repeated NamedArtifact outputs = 14;  // same artifacts as output_artifacts, with names (same order)
  NamedArtifact checkpoint = 15;        // latest checkpoint (empty artifact_id = none)
  repeated StepSpec spawn = 16;         // steps the successful attempt spawned (WorkerResult.spawn)
  repeated CalcRecord records = 17;     // Phase 8: records of the successful attempt (WorkerResult.records)
}
