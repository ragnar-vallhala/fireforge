// Message type registry for the TDR binary envelope.
//
// Every frame on the wire (peer TCP or local Unix socket) is:
//   48-byte header (big-endian, see docs/design/phase1.md §2) + protobuf payload.
// The header's `message_type` field holds one of these values and fully
// determines which protobuf message the payload contains.
//
// Requests carry a fresh message_id. Replies set correlation_id to the
// request's message_id.

syntax = "proto3";

package fireforge.tdr.v1;

enum MessageType {
  MESSAGE_TYPE_UNSPECIFIED = 0;

  // ---- Peer: node (Phase 3, payloads in peer.proto) -----------------------
  NODE_HELLO = 0x0101;       // PeerHello (both directions; reply has correlation_id)
  NODE_HEARTBEAT = 0x0102;   // PeerPing (echoed back as reply)
  NODE_STATUS = 0x0103;      // reserved
  PEER_ADVERTISE = 0x0104;   // PeerGoodbye (graceful close)

  // ---- Peer: jobs (Phase 4) -----------------------------------------------
  JOB_SUBMIT = 0x0201;
  JOB_REQUEST = 0x0202;
  JOB_ASSIGN = 0x0203;
  JOB_ACCEPT = 0x0204;
  JOB_START = 0x0205;
  JOB_PROGRESS = 0x0206;
  JOB_COMPLETE = 0x0207;
  JOB_FAIL = 0x0208;
  JOB_CANCEL = 0x0209;

  // ---- Peer: artifacts (Phase 5, data links; payloads in artifact.proto) ---
  ARTIFACT_QUERY = 0x0301;      // reserved
  ARTIFACT_OFFER = 0x0302;      // ArtifactOffer      server -> fetcher
  ARTIFACT_REQUEST = 0x0303;    // ArtifactRequest    fetcher -> server (first frame)
  ARTIFACT_TRANSFER = 0x0304;   // ArtifactChunk      server -> fetcher
  ARTIFACT_CHUNK_ACK = 0x0305;  // ArtifactChunkAck   fetcher -> server
  ARTIFACT_REPLICATE = 0x0306;  // ArtifactReplicate  peer link: fetch this from me (Phase 6)

  // ---- Peer: checkpoints --------------------------------------------------
  CHECKPOINT_CREATE = 0x0401;
  CHECKPOINT_RESTORE = 0x0402;

  // ---- Peer: gangs (Phase 7, payloads in gang.proto) ----------------------
  GANG_LAUNCH = 0x0501;      // GangLaunch    head -> member
  GANG_STARTED = 0x0502;     // GangStarted   member -> head (reply)
  GANG_EXIT = 0x0503;        // GangExit      member -> head
  GANG_KILL = 0x0504;        // GangKill      head -> member

  // ---- Local: daemon <-> worker child process (Phase 1) -------------------
  WORKER_HELLO = 0x1001;     // worker -> daemon   WorkerHello
  WORKER_TASK = 0x1002;      // daemon -> worker   WorkerTask   (reply to HELLO)
  WORKER_PROGRESS = 0x1003;  // worker -> daemon   WorkerProgress (no reply)
  WORKER_RESULT = 0x1004;    // worker -> daemon   WorkerResult
  WORKER_CANCEL = 0x1005;    // daemon -> worker   WorkerCancel (unsolicited)
  WORKER_ACK = 0x1006;       // daemon -> worker   Ack          (reply to RESULT, CHECKPOINT)
  WORKER_CHECKPOINT = 0x1007;  // worker -> daemon WorkerCheckpoint (Phase 6)
  WORKER_EXEC = 0x1008;        // daemon -> tdr-launch member   WorkerExec (Phase 7)
  WORKER_GANG_LAUNCH = 0x1009; // tdr-launch agent -> daemon    GangLaunchRequest (Phase 7)
  WORKER_GANG_EXIT = 0x100A;   // daemon -> tdr-launch agent    GangExitNotice (Phase 7)

  // ---- Local: tdrctl <-> daemon (Phase 1) ---------------------------------
  CTL_SUBMIT = 0x1101;             // SubmitJobRequest  -> SubmitJobReply
  CTL_SUBMIT_REPLY = 0x1102;
  CTL_GET_JOB = 0x1103;            // GetJobRequest     -> JobStatus
  CTL_JOB_INFO = 0x1104;
  CTL_LIST_JOBS = 0x1105;          // ListJobsRequest   -> JobList
  CTL_JOB_LIST = 0x1106;
  CTL_CANCEL = 0x1107;             // CancelJobRequest  -> Ack
  CTL_ACK = 0x1108;
  CTL_NODE_STATUS = 0x1109;        // NodeStatusRequest -> NodeStatus
  CTL_NODE_STATUS_REPLY = 0x110A;
  CTL_PEERS = 0x110B;              // PeersRequest      -> PeerList (Phase 2)
  CTL_PEERS_REPLY = 0x110C;
  CTL_ARTIFACT_PUT = 0x110D;       // ArtifactPutRequest  -> LocalArtifact (Phase 5)
  CTL_ARTIFACT_GET = 0x110E;       // ArtifactGetRequest  -> LocalArtifact (fetches if missing)
  CTL_ARTIFACT_LIST = 0x110F;      // ArtifactListRequest -> LocalArtifactList
  CTL_ARTIFACT_RM = 0x1110;        // ArtifactRmRequest   -> Ack
  CTL_ARTIFACT_GC = 0x1111;        // ArtifactGcRequest   -> GcReport
  CTL_ARTIFACT_REPLY = 0x1112;
  CTL_ARTIFACT_LIST_REPLY = 0x1113;
  CTL_ARTIFACT_GC_REPLY = 0x1114;

  // Any request may be answered with ERROR (payload: Error).
  ERROR = 0x7FFF;
}
