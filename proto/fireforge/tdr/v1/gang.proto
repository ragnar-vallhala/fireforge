// Gang (multi-node MPI) launch on PEER links (docs/design/phase7.md §5).
// gang_id is the control-plane attempt id shared by every member.

syntax = "proto3";

package fireforge.tdr.v1;

// head -> member (GANG_LAUNCH): run `command` (a /bin/sh -c string from mpirun's
// launch agent) in the member's waiting `tdr-launch member` process.
message GangLaunch {
  string gang_id = 1;
  uint64 launch_id = 2;   // chosen by the head, unique per head process
  string command = 3;
}

// member -> head (GANG_STARTED): reply to GANG_LAUNCH.
message GangStarted {
  uint64 launch_id = 1;
  bool ok = 2;
  string error = 3;       // when !ok
}

// member -> head (GANG_EXIT): the launched member job ended.
message GangExit {
  uint64 launch_id = 1;
  int32 exit_code = 2;    // 128+signal for signals, -1 unknown
  string error = 3;
}

// head -> member (GANG_KILL): cancel the member job of this gang.
message GangKill {
  string gang_id = 1;
  string reason = 2;
}
