// Local IPC payloads: daemon <-> worker child, and tdrctl <-> daemon.
// Both use the same 48-byte envelope over Unix domain sockets.

syntax = "proto3";

package fireforge.tdr.v1;

import "fireforge/tdr/v1/job.proto";
import "fireforge/control/v1/control.proto";

// ---------------------------------------------------------------------------
// Worker protocol
//
// The daemon launches each attempt with these environment variables:
//   FIREFORGE_IPC_SOCKET       path of the daemon's worker socket
//   FIREFORGE_JOB_ID
//   FIREFORGE_ATTEMPT_ID
//   FIREFORGE_ATTEMPT_TOKEN    secret; proves the connection belongs to the attempt
//   FIREFORGE_WORKDIR          attempt working directory (also the cwd)
//   FIREFORGE_INPUT_DIR        materialized input artifacts
//   FIREFORGE_OUTPUT_DIR       files written here can be published as outputs
//   FIREFORGE_CHECKPOINT_DIR
//
// Flow: HELLO -> TASK, then any number of PROGRESS, then RESULT -> ACK.
// The daemon may send CANCEL at any time; the worker should stop promptly.
// SDK use is optional: a plain command that never connects is judged by its
// exit code, and everything under FIREFORGE_OUTPUT_DIR becomes its outputs.
// ---------------------------------------------------------------------------

message WorkerHello {
  string attempt_id = 1;
  string token = 2;
  uint32 pid = 3;
  string sdk_version = 4;
}

message InputFile {
  string artifact_id = 1;
  string path = 2;   // absolute path inside FIREFORGE_INPUT_DIR
  string name = 3;   // Phase 6: JobSpec.input_names entry ("" = unnamed)
}

message WorkerTask {
  string job_id = 1;
  string attempt_id = 2;
  uint32 attempt_number = 3;    // 1-based
  string operation = 4;
  string parameters_json = 5;
  repeated InputFile inputs = 6;
  string output_dir = 7;
  string checkpoint_dir = 8;
  string campaign_id = 9;
  string material_id = 10;
  // ---- Phase 6 ----
  string resume_checkpoint = 11;   // absolute path of the checkpoint to resume from ("" = none)
  string workflow_id = 12;
  string step = 13;
  bool checkpoint_enabled = 14;    // ExecutionPolicy.checkpoint
}

message WorkerProgress {
  string attempt_id = 1;
  double fraction = 2;   // 0..1
  string message = 3;
}

message OutputFile {
  string path = 1;        // relative to output_dir
  string media_type = 2;  // e.g. "application/json", "chemical/x-cif"
  string name = 3;        // logical name, e.g. "band_structure"
}

message WorkerResult {
  string attempt_id = 1;
  bool success = 2;
  string error = 3;
  bool retryable = 4;     // failure may succeed on another attempt
  repeated OutputFile outputs = 5;
  repeated StepSpec spawn = 6;     // Phase 6: steps to add to the workflow (success only)
}

// worker -> daemon (WORKER_CHECKPOINT), reply Ack or ERROR. Phase 6.
message WorkerCheckpoint {
  string attempt_id = 1;
  string path = 2;        // file inside checkpoint_dir (relative or absolute)
  string media_type = 3;
  string name = 4;        // logical name ("" = "checkpoint")
}

// ---- Phase 7 gangs (phase7.md §5) ----
// daemon -> `tdr-launch member` (WORKER_EXEC, unsolicited): exec /bin/sh -c command.
message WorkerExec {
  string command = 1;
}

// `tdr-launch agent` -> daemon (WORKER_GANG_LAUNCH) on a fresh connection.
// Reply WORKER_ACK once the member started it, or ERROR.
message GangLaunchRequest {
  string attempt_id = 1;   // the head job's local attempt (FIREFORGE_ATTEMPT_ID)
  string token = 2;        // FIREFORGE_ATTEMPT_TOKEN
  string host = 3;         // member node id from the hostfile
  string command = 4;      // shell words joined, --daemonize removed
}

// daemon -> agent (WORKER_GANG_EXIT, unsolicited): the remote command ended.
message GangExitNotice {
  int32 exit_code = 1;     // 128+signal, -1 unknown
  string error = 2;
}

message WorkerCancel {
  string attempt_id = 1;
  string reason = 2;
}

// ---------------------------------------------------------------------------
// Control protocol (tdrctl)
// ---------------------------------------------------------------------------

message SubmitJobRequest {
  JobSpec spec = 1;
  bool remote = 2;      // Phase 4: submit to the control-plane queue via this node
}
message SubmitJobReply { string job_id = 1; }

message GetJobRequest {
  string job_id = 1;
  bool remote = 2;      // central job (reply JobStatus with node_id set)
}

message ListJobsRequest {
  JobState state = 1;   // JOB_STATE_UNSPECIFIED = all
  uint32 limit = 2;     // 0 = 100
  bool remote = 3;      // central jobs
}
message JobList { repeated JobStatus jobs = 1; }

message CancelJobRequest {
  string job_id = 1;
  bool remote = 2;
}

message NodeStatusRequest {}

message ResourceAmounts {
  uint32 cpu_cores = 1;
  uint64 memory_bytes = 2;
  uint32 jobs = 3;
  uint64 disk_bytes = 4;
}

message NodeStatus {
  string node_name = 1;
  string daemon_version = 2;
  ResourceAmounts capacity = 3;    // configured caps
  ResourceAmounts allocated = 4;   // reserved by ASSIGNED/RUNNING jobs
  uint32 running_jobs = 5;
  uint32 queued_jobs = 6;
  uint64 failed_jobs = 7;
  bool cgroups_enabled = 8;
  int64 started_unix_ms = 9;

  // Control plane (Phase 2). control_state: "standalone" | "registering" |
  // "connected" | "disconnected".
  string control_state = 10;
  string node_id = 11;
  uint64 policy_version = 12;
  int64 last_heartbeat_ok_unix_ms = 13;
  string control_url = 14;
  string last_control_error = 15;
}

message PeersRequest {}
message PeerList {
  repeated fireforge.control.v1.NodeInfo peers = 1;            // directory
  int64 refreshed_unix_ms = 2;    // 0 = never fetched
  repeated fireforge.control.v1.PeerReachability connections = 3;  // live link state (Phase 3)
  uint32 listen_port = 4;         // bound peer port (0 = peer listener off)
}

// ---- artifacts (Phase 5, docs/design/phase5.md §7) ----
message LocalArtifact {
  fireforge.control.v1.ArtifactRef ref = 1;
  string local_path = 2;           // file inside the store
  int64 last_used_unix_ms = 3;     // store file mtime (LRU clock)
  bool fetched = 4;                // GET: had to be fetched from a peer
}
message LocalArtifactList {
  repeated LocalArtifact artifacts = 1;
  uint64 store_bytes = 2;
  uint64 max_bytes = 3;            // 0 = no cap
}
message ArtifactPutRequest {
  string path = 1;                 // absolute path readable by tdrd
  string media_type = 2;
}
message ArtifactGetRequest { string artifact_id = 1; }
message ArtifactListRequest {}
message ArtifactRmRequest {
  string artifact_id = 1;
  bool force = 2;                  // delete even the last known copy
}
message ArtifactGcRequest {}
message GcReport {
  repeated string evicted = 1;
  uint64 freed_bytes = 2;
  uint64 store_bytes = 3;          // after
  uint64 max_bytes = 4;
  uint32 kept_last_copy = 5;       // candidates refused: only copy
  uint32 kept_pinned = 6;
  uint32 kept_protected = 7;       // in use / too young
}

message Ack {}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  BAD_REQUEST = 1;
  NOT_FOUND = 2;
  CONFLICT = 3;        // e.g. cancel of a terminal job
  UNAUTHORIZED = 4;    // bad attempt token
  INTERNAL = 5;
  UNSUPPORTED = 6;     // unknown message type
  UNAVAILABLE = 7;     // temporarily refused (e.g. artifact server busy, Phase 5)
}

message Error {
  ErrorCode code = 1;
  string message = 2;
}
