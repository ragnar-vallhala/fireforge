// Control-plane API payloads (docs/design/phase2.md §3).
// Sent over HTTPS as proto3 JSON with original field names.

syntax = "proto3";

package fireforge.control.v1;

import "fireforge/tdr/v1/job.proto";
import "fireforge/tdr/v1/record.proto";

// ---- nodes ----------------------------------------------------------------

message NodeAddress {
  string type = 1;      // "lan" | "tailscale" | "public"
  string address = 2;   // IPv4 or IPv6 literal, or a hostname
  uint32 port = 3;
}

message NodeResources {
  uint32 cpu_cores = 1;
  uint64 memory_bytes = 2;
  uint64 disk_bytes = 3;
  uint32 gpu_count = 4;
}

// 0 in any max_* field means "no central limit" (the local tdr.conf cap applies).
message ResourcePolicy {
  uint64 version = 1;          // bumped on every change; starts at 1
  string profile = 2;          // "" | "small" | "medium" | "compute" | "gpu"
  uint32 max_cpu_cores = 3;
  uint64 max_memory_bytes = 4;
  uint32 max_jobs = 5;
  uint64 max_disk_bytes = 6;
  uint32 max_gpus = 7;
  int64 updated_unix_ms = 8;
  string updated_by = 9;
}

enum NodeHealth {
  NODE_HEALTH_UNSPECIFIED = 0;
  ONLINE = 1;
  STALE = 2;
  OFFLINE = 3;
}

message RegisterRequest {
  string name = 1;                     // must equal the client cert CN
  string daemon_version = 2;
  repeated NodeAddress addresses = 3;
  NodeResources physical = 4;          // detected hardware
  NodeResources configured = 5;        // local tdr.conf caps
  repeated string capabilities = 6;    // e.g. "cpu", "gpu:cuda", "cgroups", "job-user"
}

message RegisterReply {
  string node_id = 1;
  ResourcePolicy policy = 2;
  uint32 heartbeat_interval_seconds = 3;
  int64 server_time_unix_ms = 4;
}

message Heartbeat {
  string node_id = 1;
  int64 sent_unix_ms = 2;
  string daemon_version = 3;
  NodeResources capacity = 4;          // effective caps after policy
  NodeResources allocated = 5;
  double cpu_utilization = 6;          // 0..1, whole machine
  uint64 memory_available_bytes = 7;
  uint64 disk_available_bytes = 8;
  uint32 running_jobs = 9;
  uint32 queued_jobs = 10;
  uint64 failed_jobs = 11;
  uint64 policy_version = 12;          // version the node has applied
  repeated NodeAddress addresses = 13; // may change (DHCP, Tailscale up/down)
  repeated PeerReachability peers = 14; // this node's view of its peer links (Phase 3)
  repeated LeaseRef leases = 15;       // leases this node holds; renewed by this heartbeat (Phase 4)
}

// One peer as seen by the reporting node (docs/design/phase3.md §5).
message PeerReachability {
  string node_id = 1;
  string name = 2;
  string state = 3;                    // "CONNECTING" | "CONNECTED" | "UNAVAILABLE" | "IDLE"
  string path_type = 4;                // "lan" | "tailscale" | ... ("" when not connected)
  string address = 5;                  // "ip:port" of the live link
  double rtt_ms = 6;                   // EWMA; 0 = unknown
  int64 connected_since_unix_ms = 7;
  string last_error = 8;
  bool outbound = 9;                   // link was dialed by the reporting node
}

message HeartbeatReply {
  ResourcePolicy policy = 1;           // set only when version != applied policy_version
  uint32 heartbeat_interval_seconds = 2;
  int64 server_time_unix_ms = 3;
  repeated LeaseRef revoked = 4;       // leases from `leases` that are no longer valid: stop + discard
}

message NodeInfo {
  string node_id = 1;
  string name = 2;
  NodeHealth health = 3;
  repeated NodeAddress addresses = 4;
  repeated string capabilities = 5;
  string daemon_version = 6;
  NodeResources physical = 7;
  NodeResources configured = 8;
  ResourcePolicy policy = 9;
  Heartbeat last_heartbeat = 10;
  int64 registered_unix_ms = 11;
  int64 last_seen_unix_ms = 12;
  string cert_fingerprint = 13;        // SHA-256 of the client cert DER, hex
  string offline_reason = 14;
}

message NodeList { repeated NodeInfo nodes = 1; }

// PATCH semantics: unset fields keep their value. `profile` (if set) is
// applied first, then any explicit fields.
message UpdateLimitsRequest {
  optional string profile = 1;
  optional uint32 max_cpu_cores = 2;
  optional uint64 max_memory_bytes = 3;
  optional uint32 max_jobs = 4;
  optional uint64 max_disk_bytes = 5;
  optional uint32 max_gpus = 6;
}

message OfflineRequest { string reason = 1; }

message NodeEvent {
  int64 at_unix_ms = 1;
  NodeHealth from = 2;
  NodeHealth to = 3;
  string reason = 4;
}
message NodeEventList { repeated NodeEvent events = 1; }

// ---- campaigns --------------------------------------------------------------

enum CampaignState {
  CAMPAIGN_STATE_UNSPECIFIED = 0;
  DRAFT = 1;
  ACTIVE = 2;
  PAUSED = 3;
  COMPLETED = 4;
  ARCHIVED = 5;
}

message Campaign {
  string campaign_id = 1;
  string name = 2;
  string description = 3;
  string domain = 4;               // e.g. "thermoelectric"
  CampaignState state = 5;
  string parameters_json = 6;      // must be valid JSON ("" = {})
  string created_by = 7;           // admin cert CN
  int64 created_unix_ms = 8;
  int64 updated_unix_ms = 9;
}

message CreateCampaignRequest {
  string name = 1;
  string description = 2;
  string domain = 3;
  string parameters_json = 4;
}

message UpdateCampaignRequest {
  optional string description = 1;
  CampaignState state = 2;         // UNSPECIFIED = unchanged
  optional string parameters_json = 3;
}

message CampaignList { repeated Campaign campaigns = 1; }

// ---- jobs and leases (docs/design/phase4.md) ----------------------------------
//
// Central job states reuse fireforge.tdr.v1.JobState:
// QUEUED, LEASED, RUNNING, RETRY_PENDING, COMPLETED, FAILED, CANCELLED,
// EXPIRED, VALIDATION_FAILED.

message ArtifactRef {
  string artifact_id = 1;          // "artifact://sha256/<64 hex>"
  uint64 size = 2;
  string media_type = 3;
  string producer_job = 4;
  int64 created_unix_ms = 5;
  string name = 6;                 // Phase 6: output name within producer_job ("" in announcements)
}

// ---- gangs (phase7.md §3, §4) ----
enum GangRole {
  GANG_ROLE_UNSPECIFIED = 0;
  GANG_HEAD = 1;     // runs mpirun; rank 0 lives here; its terminal report decides the job
  GANG_MEMBER = 2;   // runs the MPI daemon started through the head's launch agent
}

message GangMember {
  string node_id = 1;
  string name = 2;
  uint32 member_index = 3;   // 0 = head
  uint32 rank_offset = 4;
  uint32 ranks = 5;
  GangRole role = 6;
  string state = 7;          // "HELD" | "READY" | "LEASED" | "RUNNING" | "SUCCEEDED" | "FAILED" | "CANCELLED" | "ABANDONED"
}

message GangInfo {
  GangRole role = 1;           // of the lease holder
  uint32 member_index = 2;     // of the lease holder
  repeated GangMember members = 3;  // all members, by member_index
  uint32 ranks = 4;            // total
  string head_node_id = 5;
}

message JobAttempt {
  string attempt_id = 1;           // "att-<16 hex>"
  uint32 number = 2;               // 1-based
  uint64 fencing_token = 3;        // == number (strictly increasing per job)
  string node_id = 4;
  string state = 5;                // "LEASED" | "RUNNING" | "SUCCEEDED" | "FAILED" | "CANCELLED" | "ABANDONED"
  string error = 6;
  int64 leased_unix_ms = 7;
  int64 expires_unix_ms = 8;
  int64 ended_unix_ms = 9;
  repeated GangMember members = 10;  // gang attempts (Phase 7)
}

message Job {
  string job_id = 1;               // "job-<16 hex>" unless the submitter chose one
  fireforge.tdr.v1.JobState state = 2;
  fireforge.tdr.v1.JobSpec spec = 3;  // spec.job_id == job_id
  uint32 attempts_used = 4;
  string current_attempt_id = 5;
  string node_id = 6;              // node of the current/last attempt ("" if never leased)
  string last_error = 7;
  repeated ArtifactRef outputs = 8;
  string submitted_by = 9;         // "<role>:<CN>"
  bool cancel_requested = 10;
  int64 created_unix_ms = 11;
  int64 updated_unix_ms = 12;
  double progress_fraction = 13;
  string progress_message = 14;
  repeated JobAttempt attempts = 15;  // filled by GET /jobs/{id} only, oldest first
  // ---- Phase 6 ----
  string workflow_id = 16;
  string step = 17;
  ArtifactRef checkpoint = 18;     // latest checkpoint (name set)
  string reserved_node = 19;       // ranked placement reservation (phase6.md §7)
  int64 reserved_until_unix_ms = 20;
  // ---- Phase 7 ----
  repeated GangMember gang = 21;   // current attempt's members, or the hold while draining
  string pending_reason = 22;      // why a QUEUED job isn't running yet (gangs)
}

// ---- workflows (phase6.md §3, §8) ----
message CreateWorkflowRequest {
  string name = 1;
  string campaign_id = 2;
  repeated fireforge.tdr.v1.StepSpec steps = 3;
}

message WorkflowStep {
  string name = 1;                 // full name ("<parent>/<short>" for spawned)
  string state = 2;                // "WAITING" | "SKIPPED" | "CANCELLED" | a JobState name
  string job_id = 3;               // "" until the step's job exists
  string parent_step = 4;          // spawning step ("" = static)
  fireforge.tdr.v1.StepSpec spec = 5;
  string node_id = 6;
  string error = 7;
  int64 updated_unix_ms = 8;
}

message Workflow {
  string workflow_id = 1;          // "wf-<16 hex>"
  string name = 2;
  string campaign_id = 3;
  string state = 4;                // "RUNNING" | "SUCCEEDED" | "FAILED" | "CANCELLED"
  string submitted_by = 5;
  int64 created_unix_ms = 6;
  int64 updated_unix_ms = 7;
  int64 finished_unix_ms = 8;
  map<string, uint32> step_counts = 9;  // step state -> count
  repeated WorkflowStep steps = 10;     // GET /workflows/{id} only, creation order
  string error = 11;                    // why FAILED (first failing step)
}

message WorkflowList { repeated Workflow workflows = 1; }

message CreateJobRequest { fireforge.tdr.v1.JobSpec spec = 1; }
message JobList { repeated Job jobs = 1; }
message CancelRequest { string reason = 1; }

// POST /jobs/{id}/status, sent by the lease holder. Fenced: attempt_id and
// fencing_token must match the job's current attempt (else 409 "stale").
message JobUpdate {
  string attempt_id = 1;
  uint64 fencing_token = 2;
  fireforge.tdr.v1.JobState state = 3;  // RUNNING | COMPLETED | FAILED | CANCELLED | EXPIRED | VALIDATION_FAILED
  string error = 4;
  bool retryable = 5;              // FAILED only
  repeated ArtifactRef outputs = 6;   // COMPLETED only
  double progress_fraction = 7;    // RUNNING only (optional)
  string progress_message = 8;
  // ---- Phase 6 ----
  repeated fireforge.tdr.v1.StepSpec spawn = 9;  // COMPLETED only: fan-out (phase6.md §5)
  ArtifactRef checkpoint = 10;     // RUNNING only: new latest checkpoint (name set)
  // ---- Phase 8 ----
  repeated fireforge.tdr.v1.CalcRecord records = 11;  // COMPLETED only: stored with the update (phase8.md §2)
}

message LeaseRequest {
  string node_id = 1;              // must be the caller
  NodeResources free = 2;          // spare capacity right now (cpu_cores, memory_bytes, gpu_count)
  uint32 max_jobs = 3;             // free job slots
}

message Lease {
  string job_id = 1;
  string attempt_id = 2;
  uint64 fencing_token = 3;
  uint32 attempt_number = 4;
  fireforge.tdr.v1.JobSpec spec = 5;
  int64 expires_unix_ms = 6;
  GangInfo gang = 7;               // set for gang (MPI) leases (Phase 7)
}

message LeaseReply {
  repeated Lease leases = 1;
  uint32 lease_ttl_seconds = 2;
}

message LeaseRef {
  string job_id = 1;
  string attempt_id = 2;
  uint64 fencing_token = 3;
}

// POST /artifacts/announce. A full sync is one or more pages with the same
// sync_id; the page with full=true ends it and drops this node's rows not
// seen in the sync. Incremental announcements leave sync_id empty.
message ArtifactAnnouncement {
  string node_id = 1;
  repeated ArtifactRef artifacts = 2;
  string sync_id = 3;
  bool full = 4;
}

message ArtifactInfo {
  ArtifactRef artifact = 1;
  repeated string node_ids = 2;    // nodes holding a copy, by name order
  bool pinned = 3;                 // Phase 5: never released by GC
}

// POST /artifacts/sha256/{hex}/release (phase5.md §6). Atomic: drops this
// node's location only if another node holds a copy and it isn't pinned
// (force: always, used by tdrctl artifact rm --force).
message ReleaseRequest {
  string node_id = 1;
  bool force = 2;
}
message ReleaseReply {
  bool released = 1;
  string reason = 2;               // "last copy" | "pinned" when not released
}

// ---- audit / errors ---------------------------------------------------------

message AuditEntry {
  int64 at_unix_ms = 1;
  string actor = 2;        // "<role>:<CN>"
  string action = 3;       // e.g. "node.limits", "campaign.update"
  string target = 4;       // node_id / campaign_id
  string details_json = 5;
}
message AuditList { repeated AuditEntry entries = 1; }

message ApiError {
  string code = 1;         // "bad_request" | "forbidden" | "not_found" | "conflict" | "internal" | ...
  string message = 2;
}
